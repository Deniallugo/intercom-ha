image: ghcr.io/deniallugo/intercom-ha/{arch}-intercom-relay
name: Intercom Relay
description: Receives push-to-talk audio from the ESPHome intercom devices and plays it on HA media players.
version: "4.2.0"
slug: intercom_relay
init: false
hassio_api: true
hassio_role: homeassistant
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-multiple
panel_title: Intercom
arch:
  - aarch64
  - amd64
options:
  ha_url: "http://homeassistant.local:8123"
  port: 9999
  sample_rate: 16000
  bits_per_sample: 16
  channels: 1
  tts_engine: "tts.piper"
  keep_recordings: 10
  denoise: true
schema:
  ha_url: str
  port: int
  sample_rate: int(8000,48000)
  bits_per_sample: int(16,16)
  channels: int(1,1)
  tts_engine: str
  keep_recordings: int(0,200)
  denoise: bool
map:
  - config:rw
ports:
  9999/tcp: 9999
ports_description:
  9999/tcp: ESPHome audio relay
