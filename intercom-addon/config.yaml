image: ghcr.io/deniallugo/intercom-ha/{arch}-intercom-relay
name: Intercom Relay
description: Receives push-to-talk audio from the ESPHome intercom devices and plays it on HA media players.
version: "4.4.1"
slug: intercom_relay
init: false
hassio_api: true
hassio_role: homeassistant
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-multiple
panel_title: Intercom
arch:
  - aarch64
  - amd64
options:
  tts_engine: "tts.piper"
  keep_recordings: 0
  denoise: true
schema:
  tts_engine: str
  keep_recordings: int(0,200)
  denoise: bool
  lan_token: password?
map:
  - config:rw
ports:
  9999/tcp: 9999
ports_description:
  9999/tcp: ESPHome audio relay
