image: ghcr.io/deniallugo/intercom-ha/intercom-relay
name: Intercom Relay
description: Receives audio from Atom Echo and plays it on HA media players.
version: "1.3.2"
slug: intercom_relay
init: false
hassio_api: true
hassio_role: homeassistant
homeassistant_api: true
arch:
  - aarch64
  - amd64
options:
  ha_url: "http://homeassistant.local:8123"
  port: 9999
  media_players: []
  sample_rate: 16000
  bits_per_sample: 16
  channels: 1
schema:
  ha_url: str
  port: int
  media_players:
    - str
  sample_rate: int
  bits_per_sample: int
  channels: int
map:
  - config:rw
ports:
  9999/tcp: 9999
ports_description:
  9999/tcp: ESPHome audio relay
