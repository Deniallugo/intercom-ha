<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intercom Picker</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 720px; }
  h1 { margin-top: 0; }
  .row { padding: 0.75rem 0; border-bottom: 1px solid #eee; }
  .row:last-child { border-bottom: none; }
  .src-line { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.4rem; }
  .src-id { font-family: ui-monospace, monospace; color: #888; font-size: 0.85rem; }
  .alias-input { padding: 0.25rem 0.5rem; font-size: 0.95rem; flex: 0 0 14rem; }
  .self-line { margin-bottom: 0.4rem; font-size: 0.9rem; color: #444; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.4rem; min-height: 1.6rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.2rem 0.6rem; background: #eef; border-radius: 999px;
    font-size: 0.9rem;
  }
  .chip button {
    border: none; background: transparent; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 0; color: #557;
  }
  .empty { color: #888; font-style: italic; font-size: 0.9rem; }
  select { padding: 0.35rem 0.5rem; font-size: 0.95rem; }
  .toolbar { margin-top: 1rem; }
  .toast { margin-left: 1rem; color: #2a7; }
  .error { color: #c33; }
  .hint { color: #666; margin: 0.75rem 0; }
  button.save { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  .rec { padding: 0.6rem 0; border-bottom: 1px solid #eee; }
  .rec:last-child { border-bottom: none; }
  .rec-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .rec-src { font-weight: 600; }
  .rec-meta { color: #888; font-size: 0.85rem; }
  .rec audio { width: 100%; margin-top: 0.35rem; }
  .linkish {
    border: none; background: transparent; padding: 0; cursor: pointer;
    color: #557; font-size: 0.85rem; text-decoration: underline;
  }
</style>
</head>
<body>
<h1>Intercom Routes</h1>
<section id="announce" style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #eee;">
  <h2 style="margin: 0 0 0.5rem;">Announce</h2>
  <textarea id="ann-text" rows="2" placeholder="Type a message to speak…"
            style="width: 100%; box-sizing: border-box; font-size: 1rem; padding: 0.5rem;"></textarea>
  <div class="chips" id="ann-chips"></div>
  <select id="ann-add"><option value="">+ add speaker…</option></select>
  <span class="hint" id="ann-allhint"> (no speakers = announce on all)</span>
  <div style="margin-top: 0.6rem;">
    <button class="save" id="ann-send">Announce</button>
    <span id="ann-toast" class="toast"></span>
  </div>
</section>
<section id="recordings" style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #eee;">
  <div class="src-line">
    <h2 style="margin: 0 0.5rem 0 0;">Mic recordings</h2>
    <button class="linkish" id="rec-refresh">refresh</button>
  </div>
  <div class="hint" style="margin: 0.2rem 0 0.6rem;">
    The raw mic audio of the last few uploads — press “Mic test recording” on a
    device, then refresh.
  </div>
  <div id="rec-list"></div>
</section>
<div id="status"></div>
<div id="content"></div>
<div class="toolbar">
  <button class="save" id="save">Save</button>
  <span id="toast" class="toast"></span>
</div>
<script>
const $ = (id) => document.getElementById(id);
let state = { available: [], routes: {}, default: [], aliases: {}, selves: {} };

async function load() {
  $("status").textContent = "Loading...";
  try {
    const resp = await fetch("./api/players");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    state = await resp.json();
    state.aliases = state.aliases || {};
    state.selves  = state.selves  || {};
    render();
    $("status").textContent = "";
  } catch (e) {
    $("status").innerHTML = '<span class="error">Could not load: ' + e + '</span> <button onclick="load()">Retry</button>';
    $("content").innerHTML = "";
  }
}

function targetsFor(src) {
  return src === "default" ? state.default : state.routes[src];
}

function friendlyName(eid) {
  const t = state.available.find((x) => x.entity_id === eid);
  return t ? t.friendly_name : eid;
}

function renderRow(src) {
  const selected = targetsFor(src);
  const row = document.createElement("div");
  row.className = "row";

  const head = document.createElement("div");
  head.className = "src-line";
  if (src === "default") {
    const label = document.createElement("div");
    label.style.fontWeight = "600";
    label.textContent = "default";
    head.appendChild(label);
  } else {
    const aliasInput = document.createElement("input");
    aliasInput.className = "alias-input";
    aliasInput.placeholder = "alias (e.g. Kitchen)";
    aliasInput.value = state.aliases[src] || "";
    aliasInput.addEventListener("input", () => {
      const v = aliasInput.value.trim();
      if (v) state.aliases[src] = v;
      else delete state.aliases[src];
    });
    head.appendChild(aliasInput);

    const sid = document.createElement("span");
    sid.className = "src-id";
    sid.textContent = src;
    head.appendChild(sid);
  }
  row.appendChild(head);

  if (src !== "default") {
    const selfLine = document.createElement("div");
    selfLine.className = "self-line";
    const lbl = document.createElement("span");
    lbl.textContent = "this device's speaker: ";
    selfLine.appendChild(lbl);

    const selfSel = document.createElement("select");
    const none = document.createElement("option");
    none.value = "";
    none.textContent = "(none — talkback disabled)";
    selfSel.appendChild(none);
    for (const tgt of state.available) {
      const opt = document.createElement("option");
      opt.value = tgt.entity_id;
      opt.textContent = tgt.friendly_name + " (" + tgt.entity_id + ")";
      if (state.selves[src] === tgt.entity_id) opt.selected = true;
      selfSel.appendChild(opt);
    }
    selfSel.addEventListener("change", () => {
      if (selfSel.value) state.selves[src] = selfSel.value;
      else delete state.selves[src];
    });
    selfLine.appendChild(selfSel);
    row.appendChild(selfLine);
  }

  const chips = document.createElement("div");
  chips.className = "chips";
  if (selected.length === 0) {
    const e = document.createElement("span");
    e.className = "empty";
    e.textContent = "no targets";
    chips.appendChild(e);
  } else {
    for (const eid of selected) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = friendlyName(eid) + " ";
      const x = document.createElement("button");
      x.textContent = "×";
      x.title = eid;
      x.addEventListener("click", () => {
        const arr = targetsFor(src);
        const i = arr.indexOf(eid);
        if (i >= 0) arr.splice(i, 1);
        render();
      });
      chip.appendChild(x);
      chips.appendChild(chip);
    }
  }
  row.appendChild(chips);

  const sel = document.createElement("select");
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "+ add speaker…";
  sel.appendChild(placeholder);
  for (const tgt of state.available) {
    if (selected.includes(tgt.entity_id)) continue;
    const opt = document.createElement("option");
    opt.value = tgt.entity_id;
    opt.textContent = tgt.friendly_name + "  (" + tgt.entity_id + ")";
    sel.appendChild(opt);
  }
  sel.addEventListener("change", () => {
    if (!sel.value) return;
    targetsFor(src).push(sel.value);
    render();
  });
  row.appendChild(sel);

  return row;
}

function render() {
  const sources = Object.keys(state.routes).sort();
  $("content").innerHTML = "";

  if (sources.length === 0) {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "No sources enrolled yet. Press the PTT on each Atom Echo once to enroll it.";
    $("content").appendChild(hint);
  }

  for (const src of [...sources, "default"]) {
    $("content").appendChild(renderRow(src));
  }
  renderAnnounce();
}

async function save() {
  $("toast").textContent = "";
  try {
    const resp = await fetch("./api/players", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        routes:  state.routes,
        default: state.default,
        aliases: state.aliases,
        selves:  state.selves,
      }),
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error("HTTP " + resp.status + (body.error ? ": " + body.error : ""));
    }
    $("toast").textContent = "Saved";
    setTimeout(() => { $("toast").textContent = ""; }, 2000);
  } catch (e) {
    $("toast").innerHTML = '<span class="error">Save failed: ' + e + '</span>';
  }
}

$("save").addEventListener("click", save);

let annTargets = [];

function renderAnnounce() {
  const chips = $("ann-chips");
  chips.innerHTML = "";
  for (const eid of annTargets) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = friendlyName(eid) + " ";
    const x = document.createElement("button");
    x.textContent = "×";
    x.title = eid;
    x.addEventListener("click", () => {
      annTargets = annTargets.filter((e) => e !== eid);
      renderAnnounce();
    });
    chip.appendChild(x);
    chips.appendChild(chip);
  }
  const sel = $("ann-add");
  sel.innerHTML = '<option value="">+ add speaker…</option>';
  for (const tgt of state.available) {
    if (annTargets.includes(tgt.entity_id)) continue;
    const opt = document.createElement("option");
    opt.value = tgt.entity_id;
    opt.textContent = tgt.friendly_name + "  (" + tgt.entity_id + ")";
    sel.appendChild(opt);
  }
}

$("ann-add").addEventListener("change", (e) => {
  if (!e.target.value) return;
  annTargets.push(e.target.value);
  renderAnnounce();
});

$("ann-send").addEventListener("click", async () => {
  const text = $("ann-text").value.trim();
  $("ann-toast").textContent = "";
  if (!text) {
    $("ann-toast").innerHTML = '<span class="error">Enter a message first</span>';
    return;
  }
  try {
    const resp = await fetch("./api/announce", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, targets: annTargets}),
    });
    if (!resp.ok) {
      const b = await resp.json().catch(() => ({}));
      throw new Error("HTTP " + resp.status + (b.error ? ": " + b.error : ""));
    }
    $("ann-toast").textContent = "Announced";
    $("ann-text").value = "";
    setTimeout(() => { $("ann-toast").textContent = ""; }, 2000);
  } catch (e) {
    $("ann-toast").innerHTML = '<span class="error">Failed: ' + e + '</span>';
  }
});

function recWhen(epochSeconds) {
  return new Date(epochSeconds * 1000).toLocaleString();
}

function renderRecordings(data) {
  const list = $("rec-list");
  list.innerHTML = "";

  if (!data.keep) {
    const off = document.createElement("div");
    off.className = "hint";
    off.textContent = "Retention is off — set keep_recordings in the add-on configuration.";
    list.appendChild(off);
    return;
  }
  if (!data.items.length) {
    const none = document.createElement("div");
    none.className = "empty";
    none.textContent = "No recordings yet.";
    list.appendChild(none);
    return;
  }

  for (const item of data.items) {
    const row = document.createElement("div");
    row.className = "rec";

    const head = document.createElement("div");
    head.className = "rec-head";

    const src = document.createElement("span");
    src.className = "rec-src";
    src.textContent = state.aliases[item.source] || item.source;
    head.appendChild(src);

    const meta = document.createElement("span");
    meta.className = "rec-meta";
    const secs = item.seconds == null ? "?" : item.seconds.toFixed(1);
    meta.textContent = recWhen(item.modified) + " · " + secs + "s · "
                     + Math.round(item.bytes / 1024) + " kB";
    head.appendChild(meta);

    const dl = document.createElement("a");
    dl.href = "./api/recordings/" + encodeURIComponent(item.name);
    dl.download = item.name;
    dl.className = "linkish";
    dl.textContent = "download";
    head.appendChild(dl);

    const del = document.createElement("button");
    del.className = "linkish";
    del.textContent = "delete";
    del.addEventListener("click", async () => {
      del.disabled = true;
      await fetch("./api/recordings/" + encodeURIComponent(item.name), {method: "DELETE"});
      loadRecordings();
    });
    head.appendChild(del);
    row.appendChild(head);

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = "./api/recordings/" + encodeURIComponent(item.name);
    row.appendChild(audio);

    list.appendChild(row);
  }
}

async function loadRecordings() {
  try {
    const resp = await fetch("./api/recordings");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    renderRecordings(await resp.json());
  } catch (e) {
    $("rec-list").innerHTML = '<span class="error">Could not load recordings: ' + e + '</span>';
  }
}

$("rec-refresh").addEventListener("click", loadRecordings);

load();
loadRecordings();
</script>
</body>
</html>
