substitutions:
  name: atom-echo
  friendly_name: Atom Echo

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  includes:
    - recorder.h
    - uploader.h
  on_boot:
    - priority: 600.0
      then:
        - lambda: recorder_init();
    - priority: 200.0
      then:
        - lambda: |-
            id(atom_mic).add_data_callback([](const std::vector<uint8_t>& data) {
              recorder_on_data(data.data(), data.size());
            });

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"
    password: !secret ap_password

captive_portal:

# ── Audio hardware ─────────────────────────────────────────────────────────────

i2s_audio:
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: atom_mic
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true

# ── Status LED (single SK6812 on GPIO27) ───────────────────────────────────────

light:
  - platform: neopixelbus
    type: GRB
    variant: SK6812
    pin: GPIO27
    num_leds: 1
    name: "Status LED"
    id: status_led
    restore_mode: ALWAYS_OFF

# ── Push-to-talk button (GPIO39, active LOW) ───────────────────────────────────

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    on_press:
      - if:
          condition:
            lambda: 'return uploader_is_uploading();'
          then:
            - logger.log: "button ignored — upload in progress"
          else:
            - light.turn_on:
                id: status_led
                red: 0%
                green: 0%
                blue: 100%
            - lambda: |-
                recorder_start();
                id(atom_mic).start();
                uploader_start("http://homeassistant.local:9999/intercom", App.get_name().c_str());
    on_release:
      - lambda: |-
          id(atom_mic).stop();
          recorder_stop();
      - light.turn_on:
          id: status_led
          red: 100%
          green: 100%
          blue: 0%
      - wait_until:
          condition:
            lambda: 'return !uploader_is_uploading();'
          timeout: 10s
      - light.turn_off: status_led
