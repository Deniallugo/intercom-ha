# Shared baseline for every device. Needs ${name}, ${wifi_ssid}, ${wifi_password},
# ${ap_password} and ${api_encryption_key} (from secrets-<device>.yaml).

logger:

api:
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # Default power save added ~84 ms avg RTT on a strong link, which delayed TTS
  # replies by seconds.
  power_save_mode: none
  ap:
    ssid: "${name} Fallback"
    password: ${ap_password}

captive_portal:
