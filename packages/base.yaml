# Shared baseline for every ESPHome device in this repo.
# Devices include via:
#   packages:
#     secrets: !include secrets-<device>.yaml   # defines substitutions
#     base:    !include ../packages/base.yaml   # consumes them
#
# Requires the device YAML (or a secrets package loaded first) to define:
#   ${name}                — used by AP fallback SSID
#   ${wifi_ssid}           — Wi-Fi SSID
#   ${wifi_password}       — Wi-Fi password
#   ${ap_password}         — AP fallback password
#   ${api_encryption_key}  — HA API encryption key

logger:

api:
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "${name} Fallback"
    password: ${ap_password}

captive_portal:
