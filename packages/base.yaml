# Shared baseline for every ESPHome device in this repo.
# Devices include via:  packages:  base: !include packages/base.yaml
#
# Requires the device YAML to define a `${name}` substitution before this
# package is merged (used by the AP fallback SSID).

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"
    password: !secret ap_password

captive_portal:
