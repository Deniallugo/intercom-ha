name: Build and publish addon

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build addon
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} (commit ${GITHUB_SHA}) is not in main's history. Merge the branch to main before tagging."
            exit 1
          fi

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update version in config.yaml
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.version.outputs.version }}\"/" intercom-addon/config.yaml

      # The bump is committed on top of the current main (in a separate
      # worktree, so the build below still uses the tagged tree). That keeps
      # it working when main has moved past the tag, and makes re-runs a
      # no-op once the bump has already landed.
      - name: Commit updated config.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/bump" origin/main
          cd "$RUNNER_TEMP/bump"
          sed -i "s/^version:.*/version: \"$VERSION\"/" intercom-addon/config.yaml
          if git diff --quiet; then
            echo "main already at $VERSION, skipping commit"
          else
            git commit -am "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # 2024.03.5 bootstraps cosign v2.2.3, which can no longer be
        # validated. 2026.02.1 is the newest tag that still has a published
        # builder image (later tags of this deprecated action pull images
        # that don't exist).
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --all \
            --target /data/intercom-addon \
            --no-latest
        env:
          DOCKER_USERNAME: ${{ github.repository_owner }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
