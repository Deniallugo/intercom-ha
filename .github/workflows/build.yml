name: Build and publish addon

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build addon
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} (commit ${GITHUB_SHA}) is not in main's history. Merge the branch to main before tagging."
            exit 1
          fi

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update version in config.yaml
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.version.outputs.version }}\"/" intercom-addon/config.yaml

      # The bump is committed on top of the current main (in a separate
      # worktree, so the build below still uses the tagged tree). That keeps
      # it working when main has moved past the tag, and makes re-runs a
      # no-op once the bump has already landed.
      - name: Commit updated config.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/bump" origin/main
          cd "$RUNNER_TEMP/bump"
          sed -i "s/^version:.*/version: \"$VERSION\"/" intercom-addon/config.yaml
          if git diff --quiet; then
            echo "main already at $VERSION, skipping commit"
          else
            git commit -am "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built with Docker's own actions rather than the deprecated
      # home-assistant/builder action, which has to download cosign from
      # GitHub releases first (that download kept failing). Same image names
      # and base images as before: config.yaml `image`, build.json `build_from`.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: intercom-addon
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest
          tags: ghcr.io/deniallugo/intercom-ha/amd64-intercom-relay:${{ steps.version.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: intercom-addon
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: BUILD_FROM=ghcr.io/home-assistant/aarch64-base:latest
          tags: ghcr.io/deniallugo/intercom-ha/aarch64-intercom-relay:${{ steps.version.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.arch=aarch64
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
