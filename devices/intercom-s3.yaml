substitutions:
  name: esphome-web-0f4600
  friendly_name: Intercom S3
  intercom_url: "http://homeassistant.local:9999/intercom"

packages:
  secrets: !include secrets-s3.yaml
  base: !include ../packages/base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0
  includes:
    - ../include/recorder.h
    - ../include/uploader.h
  on_boot:
    - priority: 600.0
      then:
        - lambda: recorder_init();
    - priority: 200.0
      then:
        - lambda: |-
            id(s3_mic).add_data_callback([](const std::vector<uint8_t>& data) {
              recorder_on_data(data.data(), data.size());
            });
    # mww doesn't auto-start in ESPHome 2026.x — without this it never listens.
    - priority: 100.0
      then:
        - micro_wake_word.start

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    # Cache layout — avoids boot loops (per M5Stack reference).
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

# 8 MB octal PSRAM on the S3-PICO module.
psram:
  mode: octal
  speed: 80MHz

# No UART pins broken out — log over USB CDC.
logger:
  hardware_uart: USB_CDC

# ── I²C for ES8311 codec ─────────────────────────────────────────────────────

i2c:
  - id: i2c0
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    scan: false

# Kept for the MICROPHONE: this component programs the codec over I²C at boot,
# ADC and mic_gain included. Its DAC side is unused — nothing plays through the
# internal speaker (see speaker: below).
audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000
    mic_gain: 36DB              # wake word needs this; lower if intercom clips

# ── I²S buses ────────────────────────────────────────────────────────────────
# Capture and playback are on separate buses: the mic comes from the internal
# ES8311 on bus 1, all playback goes to the external amps on bus 2. So the wake
# word keeps listening through playback — no stop-before-announcement dance.
#
# The internal ES8311 DAC → NS4150 → 1 W speaker path is NOT connected: no
# speaker is declared on bus 1 and the NS4150 enable (GPIO18) is left alone.
# intercom-s3-minimal.yaml is the internal-speaker-only build.

i2s_audio:
  # Bus 1 — internal ES8311 codec, hard-wired, not on the headers. Mic only.
  - id: i2s_bus
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11

  # Bus 2 — free pins G5/G6/G7. Broadcast bus: both MAX98357A amps listen in
  # parallel. No MCLK broken out (the MAX doesn't need it).
  - id: i2s_bus_ext
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO5

microphone:
  - platform: i2s_audio
    id: s3_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO4            # Mic data from codec ADC (ASDOUT silkscreen)
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    correct_dc_offset: true

speaker:
  # 2× MAX98357A, both playing the same mono mix (dual mono). Each is a
  # self-contained DAC+amp on G5/G6/G7. ESPHome sees ONE speaker — the amps are
  # passive parallel listeners, so the 2nd board is wiring-only (no YAML change).
  # Optional 3.5 mm line-out via a PCM5100 on the same bus — see docs/DEVICES.md.
  - platform: i2s_audio
    id: s3_speaker_ext
    i2s_audio_id: i2s_bus_ext
    i2s_dout_pin: GPIO7
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: mono

  # Two virtual sources so TTS announcements and music can share one speaker
  # (ESPHome rejects the same speaker on both pipelines).
  - platform: mixer
    id: s3_mixer
    output_speaker: s3_speaker_ext
    source_speakers:
      - id: s3_announcement_src
      - id: s3_media_src

# ── Media player (HA-controllable playback) ──────────────────────────────────

media_player:
  - platform: speaker
    id: s3_player
    name: "${friendly_name} Player"
    volume_min: 0.2
    volume_max: 0.9
    buffer_size: 1000000 # 1 MB PSRAM buffer for music streaming
    # Music (Spotify / Music Assistant).
    media_pipeline:
      speaker: s3_media_src
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    # Short interruptions: TTS, intercom, wake-word sounds.
    announcement_pipeline:
      speaker: s3_announcement_src
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    # No on_announcement / on_idle wake-word juggling: the mic is on its own I²S
    # bus, so it keeps listening straight through playback. Re-arming after
    # Assist is voice_assistant's on_end / on_error.

# ── Push-to-talk button (built-in on GPIO41, active LOW) ─────────────────────

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button"
    on_press:
      - if:
          condition:
            lambda: 'return uploader_is_uploading();'
          then:
            - logger.log: "button ignored — upload in progress"
          else:
            - globals.set:
                id: ptt_recording
                value: 'true'
            - lambda: |-
                recorder_start();
                id(s3_mic).start();   // our own listener slot
                uploader_start("${intercom_url}", App.get_name().c_str());
            # The wake word would otherwise fire on your own PTT speech. Our
            # listener slot keeps the mic running once it lets go.
            - micro_wake_word.stop:
    on_release:
      # Only the release of a press that started a recording closes it out. A
      # press refused mid-upload must not stop the mic: that slot would be the
      # wake word's, and the device would go deaf. Cleared before the tail so a
      # second press-and-release inside it cannot close it out twice.
      - if:
          condition:
            lambda: 'return id(ptt_recording);'
          then:
            - globals.set:
                id: ptt_recording
                value: 'false'
            - delay: 2s
            - lambda: recorder_stop();
            - wait_until:
                condition:
                  lambda: 'return !uploader_is_uploading();'
                timeout: 10s
            # Re-arm the wake word (its listener slot) BEFORE releasing ours, so
            # the mic never drops to zero listeners in between. Not while Assist
            # runs — it holds the wake word off itself and re-arms in on_end.
            - if:
                condition:
                  not:
                    voice_assistant.is_running:
                then:
                  - micro_wake_word.start:
            - lambda: id(s3_mic).stop();

globals:
  # True from a press that started a recording until its release.
  - id: ptt_recording
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  # If Home Assistant never answers, the pipeline sits in AWAITING_RESPONSE
  # forever — and since voice_assistant stops the wake word while it runs, the
  # device goes deaf until it is rebooted. Started in on_start, cancelled in
  # on_end / on_error, so it only fires when a run genuinely stalls.
  - id: va_watchdog
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - logger.log: "Assist stalled — no response from HA; resetting"
            - voice_assistant.stop:
            # Stopping fires on_end, which restores ducking and re-arms the wake
            # word by itself; only step in if it did not.
            - delay: 3s
            - if:
                condition:
                  and:
                    - not:
                        micro_wake_word.is_running:
                    - lambda: 'return !id(ptt_recording);'
                then:
                  - mixer_speaker.apply_ducking:
                      id: s3_media_src
                      decibel_reduction: 0
                      duration: 0.5s
                  - micro_wake_word.start:

# ── HA Voice Assistant satellite ─────────────────────────────────────────────

voice_assistant:
  id: va
  microphone: s3_mic
  media_player: s3_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0       # 4.0 clips at mic_gain 36DB
  on_start:
    - script.execute: va_watchdog
  on_end:
    - script.stop: va_watchdog
    # Re-arm the wake word — VA stopped it. Not during a PTT broadcast: the
    # button's release re-arms it then, and listening now would hear the
    # broadcast.
    - if:
        condition:
          lambda: 'return !id(ptt_recording);'
        then:
          - micro_wake_word.start:
    # Keep music ducked until the answer finishes playing. on_end fires before the
    # TTS plays, so wait for the announcement to start, then end, then restore.
    # Timeouts cover the no-answer case (first times out, second passes through).
    - wait_until:
        condition:
          lambda: 'return id(s3_player)->state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
        timeout: 1500ms
    - wait_until:
        condition:
          lambda: 'return id(s3_player)->state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
        timeout: 30s
    - mixer_speaker.apply_ducking:
        id: s3_media_src
        decibel_reduction: 0
        duration: 0.5s
  # No answer coming — restore music and re-arm.
  on_error:
    - script.stop: va_watchdog
    - mixer_speaker.apply_ducking:
        id: s3_media_src
        decibel_reduction: 0
        duration: 0.5s
    - if:
        condition:
          lambda: 'return !id(ptt_recording);'
        then:
          - micro_wake_word.start:

# ── Wake-word dispatch ───────────────────────────────────────────────────────
# "okay nabu" → HA Assist.

micro_wake_word:
  id: mww
  microphone: s3_mic
  models:
    - model: okay_nabu
      id: okay_nabu
      probability_cutoff: 0.7      # default 0.97 too strict at our gain
  on_wake_word_detected:
    # Nothing to talk to when Home Assistant is unreachable, and failing here is
    # not harmless: request_start() logs "No API client connected" and returns
    # WITHOUT firing on_error — the branch that re-arms the wake word — so the
    # device would stay deaf until it reboots. `api.connected` is the wrong
    # test: any API client, `esphome logs` included, satisfies it. Only a client
    # subscribed to the voice assistant sets this.
    - if:
        condition:
          lambda: 'return id(va)->get_api_connection() == nullptr;'
        then:
          - logger.log: "wake word ignored — Home Assistant not subscribed"
        else:
          # Duck music ~20 dB with a short ramp; restored when the answer
          # finishes. Chime is configured HA-side — an on-device chime fails
          # ("Incompatible audio streams"): external-speaker audio must go
          # through the media_player pipeline.
          - mixer_speaker.apply_ducking:
              id: s3_media_src
              decibel_reduction: 20
              duration: 0.3s
          - voice_assistant.start:
              wake_word: !lambda return wake_word;
