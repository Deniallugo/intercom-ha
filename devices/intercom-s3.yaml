substitutions:
  name: esphome-web-0f4600
  friendly_name: Intercom S3
  intercom_url: "http://homeassistant.local:9999/intercom"

packages:
  secrets: !include secrets-s3.yaml
  base: !include ../packages/base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0
  includes:
    - ../include/recorder.h
    - ../include/uploader.h
  on_boot:
    - priority: 600.0
      then:
        - lambda: recorder_init();
    - priority: 200.0
      then:
        - lambda: |-
            id(s3_mic).add_data_callback([](const std::vector<uint8_t>& data) {
              recorder_on_data(data.data(), data.size());
            });
    # mww doesn't auto-start in ESPHome 2026.x.
    - priority: 100.0
      then:
        - micro_wake_word.start

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    # Boot-loops without this cache layout (M5Stack reference config).
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

# No UART pins broken out.
logger:
  hardware_uart: USB_CDC

# ── I²C for ES8311 codec ─────────────────────────────────────────────────────

i2c:
  - id: i2c0
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    scan: false

# Needed for the mic: it programs the codec's ADC and mic_gain at boot.
audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000
    mic_gain: 36DB              # wake word needs this; lower if intercom clips

# ── I²S buses ────────────────────────────────────────────────────────────────
# Mic on bus 1, playback on bus 2, so the wake word listens through playback.
# The internal speaker is unused; intercom-s3-minimal.yaml is the build for it.

i2s_audio:
  # Bus 1 — internal ES8311 codec (mic only).
  - id: i2s_bus
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11

  # Bus 2 — G5/G6/G7, both MAX98357A amps in parallel. No MCLK needed.
  - id: i2s_bus_ext
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO5

microphone:
  - platform: i2s_audio
    id: s3_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO4            # ASDOUT
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    correct_dc_offset: true

speaker:
  # 2× MAX98357A wired in parallel on one bus: one speaker here, dual mono.
  - platform: i2s_audio
    id: s3_speaker_ext
    i2s_audio_id: i2s_bus_ext
    i2s_dout_pin: GPIO7
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: mono

  # The two media_player pipelines can't share one speaker.
  - platform: mixer
    id: s3_mixer
    output_speaker: s3_speaker_ext
    source_speakers:
      - id: s3_announcement_src
      - id: s3_media_src

# ── Media player ─────────────────────────────────────────────────────────────

media_player:
  - platform: speaker
    id: s3_player
    name: "${friendly_name} Player"
    volume_min: 0.2
    volume_max: 0.9
    buffer_size: 1000000 # 1 MB, in PSRAM
    media_pipeline:
      speaker: s3_media_src
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    announcement_pipeline:
      speaker: s3_announcement_src
      format: FLAC
      sample_rate: 48000
      num_channels: 1

# ── Push-to-talk button (built-in on GPIO41, active LOW) ─────────────────────

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button"
    on_press:
      - if:
          condition:
            lambda: 'return uploader_is_uploading();'
          then:
            - logger.log: "button ignored — upload in progress"
          else:
            - globals.set:
                id: ptt_recording
                value: 'true'
            - lambda: |-
                recorder_start();
                id(s3_mic).start();   // our own listener slot
                uploader_start("${intercom_url}", App.get_name().c_str());
            # Else it fires on the PTT speech.
            - micro_wake_word.stop:
    on_release:
      # Only if this press started a recording: stopping the mic otherwise
      # takes the wake word's slot and the device goes deaf.
      - if:
          condition:
            lambda: 'return id(ptt_recording);'
          then:
            - globals.set:
                id: ptt_recording
                value: 'false'
            - delay: 2s
            - lambda: recorder_stop();
            - wait_until:
                condition:
                  lambda: 'return !uploader_is_uploading();'
                timeout: 10s
            # Re-arm before releasing our slot so the mic never has zero
            # listeners. Assist re-arms it itself in on_end.
            - if:
                condition:
                  not:
                    voice_assistant.is_running:
                then:
                  - micro_wake_word.start:
            - lambda: id(s3_mic).stop();

globals:
  - id: ptt_recording
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  # If HA never answers, Assist hangs with the wake word off: device deaf.
  - id: va_watchdog
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - logger.log: "Assist stalled — no response from HA; resetting"
            - voice_assistant.stop:
            # on_end normally re-arms; step in only if it didn't.
            - delay: 3s
            - if:
                condition:
                  and:
                    - not:
                        micro_wake_word.is_running:
                    - lambda: 'return !id(ptt_recording);'
                then:
                  - mixer_speaker.apply_ducking:
                      id: s3_media_src
                      decibel_reduction: 0
                      duration: 0.5s
                  - micro_wake_word.start:

# ── HA Voice Assistant satellite ─────────────────────────────────────────────

voice_assistant:
  id: va
  microphone: s3_mic
  media_player: s3_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0       # 4.0 clips at mic_gain 36DB
  on_start:
    - script.execute: va_watchdog
  on_end:
    - script.stop: va_watchdog
    # Not during PTT: the release re-arms it.
    - if:
        condition:
          lambda: 'return !id(ptt_recording);'
        then:
          - micro_wake_word.start:
    # on_end fires before the reply plays: wait for it to start and finish.
    - wait_until:
        condition:
          lambda: 'return id(s3_player)->state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
        timeout: 1500ms
    - wait_until:
        condition:
          lambda: 'return id(s3_player)->state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
        timeout: 30s
    - mixer_speaker.apply_ducking:
        id: s3_media_src
        decibel_reduction: 0
        duration: 0.5s
  # No answer coming — restore music and re-arm.
  on_error:
    - script.stop: va_watchdog
    - mixer_speaker.apply_ducking:
        id: s3_media_src
        decibel_reduction: 0
        duration: 0.5s
    - if:
        condition:
          lambda: 'return !id(ptt_recording);'
        then:
          - micro_wake_word.start:

# ── Wake word ────────────────────────────────────────────────────────────────

micro_wake_word:
  id: mww
  microphone: s3_mic
  models:
    - model: okay_nabu
      id: okay_nabu
      probability_cutoff: 0.7      # default 0.97 too strict at our gain
  on_wake_word_detected:
    # Without a subscribed HA client, start() fails without firing on_error,
    # so nothing re-arms the wake word. (api.connected is also true for
    # `esphome logs`.)
    - if:
        condition:
          lambda: 'return id(va)->get_api_connection() == nullptr;'
        then:
          - logger.log: "wake word ignored — Home Assistant not subscribed"
        else:
          # Chime is set HA-side; an on-device one fails here.
          - mixer_speaker.apply_ducking:
              id: s3_media_src
              decibel_reduction: 20
              duration: 0.3s
          - voice_assistant.start:
              wake_word: !lambda return wake_word;
