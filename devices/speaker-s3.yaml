substitutions:
  name: speaker-s3
  friendly_name: Speaker S3

packages:
  secrets: !include secrets-speaker.yaml
  base: !include ../packages/base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0

esp32:
  variant: esp32s3
  flash_size: 16MB           # N16R8
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    # Octal PSRAM REQUIRES the 64-byte data cache line.
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

# 80 MHz boot-loops on these boards; keep 40.
psram:
  mode: octal
  speed: 40MHz

# USB_CDC re-enumerates on boot and loses early logs.
logger:
  hardware_uart: USB_SERIAL_JTAG

# PCM5102: BCK→G5, LCK→G6, DIN→G7, SCK→GND (internal PLL, no MCLK).
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO5

speaker:
  - platform: i2s_audio
    id: pcm5102_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO7
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: stereo
    # Stay up: a restart after a stream hiccup hits "Parent bus is busy" and
    # backs off 1 s, turning a glitch into a gap.
    timeout: never
    buffer_duration: 1000ms

  # The two media_player pipelines can't share one speaker.
  - platform: mixer
    id: speaker_mixer
    output_speaker: pcm5102_speaker
    source_speakers:
      # No `timeout: never` here: then the second announcement (TTS after the
      # chime) plays silently.
      - id: announcement_src
      - id: media_src
        timeout: never

# ── Media player ─────────────────────────────────────────────────────────────
media_player:
  - platform: speaker
    id: speaker_player
    name: "${friendly_name} Player"
    volume_min: 0.0
    volume_max: 1.0
    buffer_size: 1000000         # 1 MB, in PSRAM
    media_pipeline:
      speaker: media_src
      format: FLAC
      sample_rate: 48000
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_src
      format: FLAC
      sample_rate: 48000
      num_channels: 2
