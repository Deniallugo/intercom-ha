substitutions:
  name: atom-echo
  friendly_name: Atom Echo
  intercom_url: "http://homeassistant.local:9999/intercom"
  # Mic test target. Default: the add-on (saved in its panel, also played on the
  # targets). Point at tools/mic-capture.py for stats; PTT is unaffected.
  mic_test_url: "http://homeassistant.local:9999/intercom"

  # Push-to-talk (packages/intercom.yaml). Button GPIO39, active LOW, pull-up
  # on the board. Tail: the PDM mic's pipeline is short.
  ptt_pin: GPIO39
  ptt_pullup: "false"
  mic_id: atom_mic
  player_id: atom_player
  tail_ms: "100"
  led_pin: GPIO27

packages:
  secrets: !include secrets-atom.yaml
  base: !include ../packages/base.yaml
  intercom: !include ../packages/intercom.yaml
  feedback: !include ../packages/feedback-led.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  on_boot:
    - priority: 600.0
      then:
        - lambda: |-
            recorder_init();
            // No PGA on the PDM mic. +18 dB: the loudest capture peaks ~6 dB
            // under full scale; speech was -37..-40 dBFS at x4.
            recorder_set_gain(8, 1);
            // 1-10 Hz drift louder than speech, and a ~50 ms full-scale burst
            // while the PDM filter settles after mic start.
            recorder_set_highpass(100);
            recorder_set_skip_ms(100);
    - priority: 200.0
      then:
        - lambda: |-
            id(atom_mic).add_data_callback([](const std::vector<uint8_t>& data) {
              recorder_on_data(data.data(), data.size());
            });

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

# ── Audio hardware ─────────────────────────────────────────────────────────────

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin:
      number: GPIO33
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO19
      allow_other_uses: true
  - id: i2s_out
    i2s_lrclk_pin:
      number: GPIO33
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO19
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: atom_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true

# ── Speaker (NS4168 amp on GPIO22) ─────────────────────────────────────────────

speaker:
  - platform: i2s_audio
    id: atom_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    # One contiguous internal-RAM block, allocated last. The 500 ms default
    # (16 KB) fails on this no-PSRAM chip: "Speaker task setup failed".
    buffer_duration: 200ms

# ── Media player ───────────────────────────────────────────────────────────────

media_player:
  - platform: speaker
    id: atom_player
    name: "${friendly_name} Player"
    # Keep small: a larger buffer starves the I2S DMA alloc in internal RAM and
    # wedges the speaker until reboot.
    buffer_size: 8192
    announcement_pipeline:
      speaker: atom_speaker
      format: WAV
    # Incoming-message detection (LED, tap to silence, Do not disturb).
    on_announcement:
      - script.execute: intercom_announce_start
    on_idle:
      - script.execute: intercom_announce_end
    on_play:
      - script.execute: intercom_announce_end

# ── Memory diagnostics + DMA watchdog ──────────────────────────────────────────
# Internal DMA RAM fragments over time until the speaker can't allocate and
# wedges. Reboot before that happens.

sensor:
  - platform: template
    name: "Free DMA heap"
    entity_category: diagnostic
    unit_of_measurement: "B"
    update_interval: 10s
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_DMA);'
  # This, not total free, predicts the failure.
  - platform: template
    name: "Largest DMA block"
    entity_category: diagnostic
    unit_of_measurement: "B"
    update_interval: 10s
    lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_DMA);'

interval:
  - interval: 5s
    then:
      - lambda: |-
          static uint8_t lowhits = 0;
          size_t block = heap_caps_get_largest_free_block(MALLOC_CAP_DMA);
          // Above the largest block a broadcast needs (8192 B media buffer).
          if (block < 12000) {
            if (++lowhits >= 3) {
              ESP_LOGE("watchdog", "Largest DMA block too small (%u B), rebooting", (unsigned) block);
              App.safe_reboot();
            }
          } else {
            lowhits = 0;
          }

# ── Mic diagnostics ────────────────────────────────────────────────────────────
# Records 5 s to ${mic_test_url}, streaming (no PSRAM to hold the take).
# Mic test and PTT share the recorder, so each refuses while the other runs.

button:
  - platform: template
    id: record_test
    name: "Mic test recording"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: |-
              return uploader_is_uploading() || id(mic_test_running) ||
                     id(ptt_rec) || id(ptt_finish).is_running();
          then:
            - logger.log: "mic test ignored — recorder busy"
          else:
            - globals.set:
                id: mic_test_running
                value: 'true'
            - light.turn_on:
                id: status_led
                red: 100%
                green: 0%
                blue: 100%
                brightness: 100%
                effect: None
            - lambda: |-
                recorder_start();
                id(atom_mic).start();
                uploader_start("${mic_test_url}", App.get_name().c_str());
            - logger.log: "mic test recording started"
            - delay: 5s
            - lambda: |-
                id(atom_mic).stop();
                recorder_stop();
            - wait_until:
                condition:
                  lambda: 'return !uploader_is_uploading();'
                # Longer than the uploader's worst case (8 s connect + 8 s per
                # send + 25 s for the answer).
                timeout: 60s
            - logger.log: "mic test recording uploaded"
            - globals.set:
                id: mic_test_running
                value: 'false'
            - script.execute: fb_idle

# ── Push-to-talk hooks (packages/intercom.yaml) ────────────────────────────────
# No Assist and no alarms here.

script:
  - id: ptt_hook_talk_start
    then:
      - logger.log:
          format: "talk start"
          level: VERBOSE
  - id: ptt_hook_talk_end
    then:
      - logger.log:
          format: "talk end"
          level: VERBOSE
  # A tap does nothing on the Atom: there is no Assist, and "repeat the last
  # message" needs an add-on endpoint (docs/DEVICES.md → Talk button). A tap
  # still silences an incoming message (handled in the package).
  - id: ptt_hook_tap
    then:
      - logger.log: "tap — no action on this device"
  - id: ptt_hook_dismiss
    then:
      - logger.log:
          format: "dismiss"
          level: VERBOSE
