# Voice S3 — ESP32-S3 + PCM5102A + ZK-502MT amp + INMP441 mic + one button.
# Music Assistant player and Assist satellite. Tap = Assist, hold = intercom.
# Mic and DAC are on separate I²S peripherals, so the mic listens through playback.
# Wiring, and why not to plug USB in with 24 V on: docs/DEVICES.md → Voice S3.

substitutions:
  name: voice-s3
  friendly_name: Voice S3
  intercom_url: "http://homeassistant.local:9999/intercom"
  # Mic test target. Default: the add-on (saved in its panel, also played on the
  # targets). Point at tools/mic-capture.py for stats; PTT is unaffected.
  mic_test_url: "http://homeassistant.local:9999/intercom"

packages:
  secrets: !include secrets-voice.yaml
  base: !include ../packages/base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0
  includes:
    - ../include/recorder.h
    - ../include/uploader.h
  on_boot:
    - priority: 600.0
      then:
        - lambda: |-
            // Gain is in the data callback's shift, not recorder_set_gain().
            // PSRAM: PTT buffers 1.2 s before its upload starts, the mic test 5 s.
            recorder_init_psram(30 * 32000);
            // Measured drift and rumble below ~150 Hz louder than the speech.
            recorder_set_highpass(180);

    # Intercom tap: native 32-bit frames (24-bit data in bits 31..8) → 16-bit.
    # `>> 14` = +12 dB using bits `>> 16` would drop. Measured ceiling: worst
    # peak −5.1 dBFS; +18 dB starts clipping. Gain adds level, not SNR.
    - priority: 200.0
      then:
        - lambda: |-
            id(inmp441_mic).add_data_callback([](const std::vector<uint8_t> &data) {
              if (!recorder_is_active()) return;      // cheap gate, avoids the copy
              static std::vector<uint8_t> pcm16;
              const size_t frames = data.size() / 4;
              pcm16.resize(frames * 2);
              const int32_t *in = reinterpret_cast<const int32_t *>(data.data());
              int16_t *out = reinterpret_cast<int16_t *>(pcm16.data());
              // Saturate: wrapping turns a loud transient into a full-scale bang.
              for (size_t i = 0; i < frames; i++) {
                int32_t s = in[i] >> 14;   // +12 dB
                if (s > INT16_MAX) s = INT16_MAX;
                else if (s < INT16_MIN) s = INT16_MIN;
                out[i] = static_cast<int16_t>(s);
              }
              recorder_on_data(pcm16.data(), pcm16.size());
            });

    # mww doesn't auto-start in ESPHome 2026.x. Starting it starts the mic.
    - priority: 100.0
      then:
        - micro_wake_word.start

esp32:
  variant: esp32s3
  flash_size: 16MB           # N16R8
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    # Octal PSRAM requires the 64-byte data cache line.
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

# 80 MHz boot-loops on these boards; keep 40.
psram:
  mode: octal
  speed: 40MHz

# Transmit bursts click in the mic via the 3.3 V rail. Measured while streaming:
# 39 clicks/s at 20 dBm, 1.3/s at 8.5. If Wi-Fi drops out, raise this first.
wifi:
  output_power: 8.5dB

# USB_CDC re-enumerates on boot and loses early logs.
logger:
  hardware_uart: USB_SERIAL_JTAG

# ── I²S buses ────────────────────────────────────────────────────────────────
# Keep separate: one full-duplex bus ties mic and DAC to one clock and brings
# back "Parent bus is busy".

i2s_audio:
  # Bus 0 — PCM5102A → ZK-502MT AUX. SCK tied to GND (internal PLL, no MCLK).
  - id: i2s_out
    i2s_lrclk_pin: GPIO6     # → LCK
    i2s_bclk_pin: GPIO5      # → BCK

  # Bus 1 — INMP441 MEMS mic (capture only).
  - id: i2s_in
    i2s_lrclk_pin: GPIO11    # → WS
    i2s_bclk_pin: GPIO10     # → SCK

# ── Microphone ───────────────────────────────────────────────────────────────
# INMP441, L/R → GND (left slot). Failure signatures: docs/DEVICES.md.

microphone:
  - platform: i2s_audio
    id: inmp441_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO12      # ← SD
    adc_type: external
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000
    # Don't add use_apll: the APLL is shared with the DAC's peripheral.
    correct_dc_offset: true  # real DC bias; hurts the wake word otherwise

# ── Speaker chain ────────────────────────────────────────────────────────────

speaker:
  - platform: i2s_audio
    id: pcm5102_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO7      # → DIN
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: stereo
    # Stay up: a restart after a stream hiccup hits "Parent bus is busy" and
    # backs off 1 s, turning a glitch into a gap.
    timeout: never
    buffer_duration: 1000ms

  # The two media_player pipelines can't share one speaker.
  - platform: mixer
    id: speaker_mixer
    output_speaker: pcm5102_speaker
    source_speakers:
      # No `timeout: never` here: then the second announcement (TTS after the
      # chime) plays silently.
      - id: announcement_src
      - id: media_src
        timeout: never

# ── Media player ─────────────────────────────────────────────────────────────

media_player:
  - platform: speaker
    id: voice_player
    name: "${friendly_name} Player"
    volume_min: 0.0
    volume_max: 1.0
    buffer_size: 1000000     # 1 MB, in PSRAM
    media_pipeline:
      speaker: media_src
      format: FLAC
      sample_rate: 48000
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_src
      # Keep FLAC: WAV is ~5x the bytes and stalls this pipeline.
      format: FLAC
      sample_rate: 48000
      num_channels: 2
    # Play with `announcement: true`; speaker.play bypasses the mixer and fails
    # ("Incompatible audio streams").
    files:
      - id: chime_sound
        file: ../sounds/chime.wav

# ── Mic diagnostics ──────────────────────────────────────────────────────────
# Records 5 s, then uploads to ${mic_test_url}, so Wi-Fi is quiet while the mic
# listens. Shares the recorder with PTT; each refuses while the other runs.
button:
  - platform: template
    id: record_test
    name: "Mic test recording"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: |-
              return uploader_is_uploading() || id(mic_test_running) ||
                     id(ptt_armed) || id(intercom_recording);
          then:
            - logger.log: "mic test ignored — recorder busy"
          else:
            - globals.set:
                id: mic_test_running
                value: 'true'
            - micro_wake_word.stop:
            - lambda: |-
                id(inmp441_mic).start();   // take our own listener slot
                recorder_start();
            - logger.log: "mic test: recording, upload held back"
            - delay: 5s
            - lambda: |-
                recorder_stop();
                uploader_start("${mic_test_url}", App.get_name().c_str());
            - wait_until:
                condition:
                  lambda: 'return !uploader_is_uploading();'
                timeout: 15s
            - logger.log: "mic test uploaded"
            - micro_wake_word.start:       # re-arm before releasing our slot
            - lambda: id(inmp441_mic).stop();
            - globals.set:
                id: mic_test_running
                value: 'false'

# ── Wake word ────────────────────────────────────────────────────────────────

micro_wake_word:
  id: mww
  microphone:
    microphone: inmp441_mic
    channels: 0
    # +12 dB, same as the intercom path; 8 (+18 dB) clips. On false triggers
    # raise probability_cutoff, not this.
    gain_factor: 4
  models:
    - model: okay_nabu
      id: okay_nabu
      probability_cutoff: 0.7  # default 0.97 is too strict at this gain
  on_wake_word_detected:
    # Without a subscribed HA client, start() fails without firing on_error,
    # so nothing re-arms the wake word: deaf until reboot. (api.connected is
    # also true for `esphome logs`.)
    - if:
        condition:
          lambda: 'return id(va)->get_api_connection() == nullptr;'
        then:
          - logger.log: "wake word ignored — Home Assistant not subscribed"
        else:
          # Pause a ringing alarm while listening (the mic hears it); on_end
          # resumes it unless the timer was cancelled.
          - if:
              condition:
                script.is_running: timer_alarm
              then:
                - script.stop: timer_alarm
                - globals.set:
                    id: alarm_suspended
                    value: 'true'
          - media_player.speaker.play_on_device_media_file:
              id: voice_player
              media_file: chime_sound
              announcement: true
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

# ── HA Voice Assistant satellite ─────────────────────────────────────────────

voice_assistant:
  id: va
  microphone:
    microphone: inmp441_mic
    channels: 0
    # × volume_multiplier 2.0 = +12 dB; helps STT on a far voice.
    gain_factor: 2
  media_player: voice_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_start:
    - script.execute: va_watchdog
    - mixer_speaker.apply_ducking:
        id: media_src
        decibel_reduction: 15
        duration: 0.3s

  # Un-duck while HA thinks: a silent line lets a powered speaker with standby
  # sleep and eat the reply's start. Must be 0: broadcasts play via media_src.
  on_stt_vad_end:
    - mixer_speaker.apply_ducking:
        id: media_src
        decibel_reduction: 0
        duration: 0.3s

  on_tts_start:
    - mixer_speaker.apply_ducking:
        id: media_src
        decibel_reduction: 15
        duration: 0.2s
  on_end:
    - script.stop: va_watchdog
    # on_end fires before the reply plays: wait for it to start and finish.
    - wait_until:
        condition:
          lambda: 'return id(voice_player)->state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
        timeout: 1500ms
    - wait_until:
        condition:
          lambda: 'return id(voice_player)->state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
        timeout: 30s
    - mixer_speaker.apply_ducking:
        id: media_src
        decibel_reduction: 0
        duration: 0.5s
    # Re-arm after the reply (mww start-up stutters the decode). Not during PTT
    # or the mic test: they re-arm it themselves.
    - if:
        condition:
          lambda: 'return !id(intercom_recording) && !id(mic_test_running);'
        then:
          - micro_wake_word.start:
    # Not cancelled, so the alarm comes back.
    - if:
        condition:
          lambda: 'return id(alarm_suspended);'
        then:
          - globals.set:
              id: alarm_suspended
              value: 'false'
          - script.execute: timer_alarm
  on_error:
    - script.stop: va_watchdog
    - mixer_speaker.apply_ducking:
        id: media_src
        decibel_reduction: 0
        duration: 0.5s
    - if:
        condition:
          lambda: 'return !id(intercom_recording) && !id(mic_test_running);'
        then:
          - micro_wake_word.start:
    - if:
        condition:
          lambda: 'return id(alarm_suspended);'
        then:
          - globals.set:
              id: alarm_suspended
              value: 'false'
          - script.execute: timer_alarm

  # Timers run in HA. Any on_timer_* trigger is what advertises timer support.
  on_timer_finished:
    - script.execute: timer_alarm

  on_timer_cancelled:
    - globals.set:
        id: alarm_suspended
        value: 'false'
    - script.stop: timer_alarm

# ── Button: tap = Assist, hold = intercom ────────────────────────────────────
# Tap < 1.2 s, hold ≥ 1.2 s. GPIO18 → button → GND.
# Not GPIO38/39: next to the PSRAM bus they read 20-30 false edges/s with only
# the internal pull-up. Free RTC pads work: 1, 2, 4, 8, 9, 13-18, 21.
# GPIO33-37 belong to PSRAM.
globals:
  - id: intercom_recording
    type: bool
    restore_value: false
    initial_value: 'false'

  # This press started a recording (false if the recorder was busy).
  - id: ptt_armed
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: mic_test_running
    type: bool
    restore_value: false
    initial_value: 'false'

  # The wake word paused a ringing alarm; on_end resumes it unless cancelled.
  - id: alarm_suspended
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  # If HA never answers, Assist hangs with the wake word off: device deaf.
  - id: va_watchdog
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - logger.log: "Assist stalled — no response from HA; resetting"
            - voice_assistant.stop:
            # on_end normally re-arms; step in only if it didn't.
            - delay: 3s
            - if:
                condition:
                  and:
                    - not:
                        micro_wake_word.is_running:
                    - lambda: 'return !id(intercom_recording) && !id(mic_test_running);'
                then:
                  - mixer_speaker.apply_ducking:
                      id: media_src
                      decibel_reduction: 0
                      duration: 0.5s
                  - micro_wake_word.start:

  # Still running at release → tap; finished → hold.
  - id: hold_watch
    mode: restart
    then:
      - delay: 1200ms
      - if:
          condition:
            lambda: 'return !id(ptt_armed);'
          then:
            - logger.log: "intercom busy — hold ignored"
          else:
            # Else the wake word fires on the PTT speech.
            - micro_wake_word.stop:
            - voice_assistant.stop:
            # Drains the buffered 1.2 s, then streams: no length limit.
            - lambda: |-
                id(intercom_recording) = true;
                uploader_start("${intercom_url}", App.get_name().c_str());
            - logger.log: "intercom: recording"

  # Rings ~12 s or until a tap.
  - id: timer_alarm
    mode: restart
    then:
      - repeat:
          count: 8
          then:
            - media_player.speaker.play_on_device_media_file:
                id: voice_player
                media_file: chime_sound
                announcement: true
            - delay: 1500ms

binary_sensor:
  - platform: gpio
    id: ptt_button
    name: "Button"
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms      # debounce
      - delayed_off: 25ms
    on_press:
      # Record from the press (people talk as they press); a tap discards it.
      - if:
          condition:
            lambda: |-
              return !uploader_is_uploading() && !id(intercom_recording) &&
                     !id(mic_test_running);
          then:
            - lambda: |-
                id(inmp441_mic).start();   // our own listener slot
                recorder_start();
                id(ptt_armed) = true;
      - script.execute: hold_watch
    on_release:
      - if:
          condition:
            script.is_running: hold_watch
          # ── tap: talk to Assist (second tap cancels) ──
          then:
            - script.stop: hold_watch
            - if:
                condition:
                  lambda: 'return id(ptt_armed);'
                then:
                  - lambda: |-
                      recorder_cancel();
                      id(ptt_armed) = false;
                      id(inmp441_mic).stop();
            - if:
                condition:
                  lambda: 'return id(intercom_recording);'
                then:
                  - logger.log: "tap ignored — broadcast still finishing"
                # A tap silences a ringing (or paused) alarm and does nothing else.
                else:
                  - if:
                      condition:
                        or:
                          - script.is_running: timer_alarm
                          - lambda: 'return id(alarm_suspended);'
                      then:
                        - globals.set:
                            id: alarm_suspended
                            value: 'false'
                        - script.stop: timer_alarm
                      else:
                        - if:
                            condition:
                              voice_assistant.is_running:
                            then:
                              - voice_assistant.stop:
                            else:
                              # See on_wake_word_detected.
                              - if:
                                  condition:
                                    lambda: 'return id(va)->get_api_connection() == nullptr;'
                                  then:
                                    - logger.log: "tap ignored — Home Assistant not subscribed"
                                  else:
                                    - micro_wake_word.stop:
                                    - media_player.speaker.play_on_device_media_file:
                                        id: voice_player
                                        media_file: chime_sound
                                        announcement: true
                                    - voice_assistant.start:
          # ── hold released: close out the broadcast ──
          else:
            - if:
                condition:
                  lambda: 'return id(intercom_recording);'
                then:
                  # Before the tail, or a tap inside it cancels the broadcast.
                  - globals.set:
                      id: ptt_armed
                      value: 'false'
                  - delay: 500ms    # tail, so the last word isn't clipped
                  - lambda: |-
                      recorder_stop();
                      id(intercom_recording) = false;
                  - wait_until:
                      condition:
                        lambda: 'return !uploader_is_uploading();'
                      timeout: 10s
                  # Re-arm before releasing our slot so the mic never has zero
                  # listeners (that tears down its I²S driver).
                  - micro_wake_word.start:
                  - lambda: id(inmp441_mic).stop();
