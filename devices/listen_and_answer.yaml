substitutions:
  name: atom-echo
  friendly_name: Atom Echo

packages:
  base: !include ../packages/base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# logger / api / ota / wifi / captive_portal come from packages/base.yaml

# ── Audio hardware ─────────────────────────────────────────────────────────────

i2s_audio:
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: atom_mic
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    id: atom_spk
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000

# ── Status LED (single SK6812 on GPIO27) ───────────────────────────────────────

light:
  - platform: neopixelbus
    type: GRB
    variant: SK6812
    pin: GPIO27
    num_leds: 1
    name: "Status LED"
    id: status_led
    restore_mode: ALWAYS_OFF

# ── Voice assistant ────────────────────────────────────────────────────────────

voice_assistant:
  microphone: atom_mic
  speaker: atom_spk
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 0%
        blue: 100%
  on_stt_end:
    - light.turn_on:
        id: status_led
        red: 100%
        green: 100%
        blue: 0%
  on_tts_start:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
  on_end:
    - light.turn_off: status_led
  on_error:
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
    - delay: 0.1s
    - light.turn_off: status_led

# ── Push-to-talk button (GPIO39, active LOW) ───────────────────────────────────

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    on_press:
      - voice_assistant.start:
          silence_detection: true
    on_release:
      - logger.log: "button released - VAD handles end of speech"
