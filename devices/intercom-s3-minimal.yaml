substitutions:
  name: esphome-web-0f4600
  friendly_name: Intercom S3
  intercom_url: "http://homeassistant.local:9999/intercom"
  # Push-to-talk (packages/intercom.yaml). Built-in button GPIO41, active LOW.
  ptt_pin: GPIO41
  mic_id: s3_mic
  player_id: s3_player
  tail_ms: "2000"
  feedback_src: s3_feedback_src
  announce_src: s3_announcement_src

packages:
  secrets: !include secrets-s3.yaml
  base: !include ../packages/base.yaml
  intercom: !include ../packages/intercom.yaml
  feedback: !include ../packages/feedback-sound.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0
  on_boot:
    - priority: 600.0
      then:
        # PSRAM: room for the hold threshold plus a slow connect.
        - lambda: recorder_init_psram(10 * 32000);
    - priority: 200.0
      then:
        - lambda: |-
            id(s3_mic).add_data_callback([](const std::vector<uint8_t>& data) {
              recorder_on_data(data.data(), data.size());
            });

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    # Boot-loops without this cache layout (M5Stack reference config).
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

# No UART pins broken out.
logger:
  hardware_uart: USB_CDC
  level: DEBUG

# ── I²C for ES8311 codec ─────────────────────────────────────────────────────

i2c:
  - id: i2c0
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    scan: false

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000
    mic_gain: 18DB              # default 42DB is far too sensitive

# ── NS4150 amp enable — off means no sound from the internal speaker ─────────

switch:
  - platform: gpio
    pin: GPIO18
    id: internal_amp_enable
    name: "Internal Amp"
    restore_mode: ALWAYS_ON

# ── I²S bus shared between mic and speaker ───────────────────────────────────

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11

microphone:
  - platform: i2s_audio
    id: s3_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO4            # Mic data from codec ADC (ASDOUT silkscreen)
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    id: s3_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO48          # Speaker data to codec DAC (DSDIN silkscreen)
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: left
    audio_dac: es8311_dac

  # Talker feedback tones play over a message instead of replacing it.
  - platform: mixer
    id: s3_mixer
    output_speaker: s3_speaker
    source_speakers:
      - id: s3_announcement_src
      - id: s3_feedback_src

# ── Media player ─────────────────────────────────────────────────────────────

media_player:
  - platform: speaker
    id: s3_player
    name: "${friendly_name} Player"
    volume_min: 0.5
    volume_max: 0.9
    announcement_pipeline:
      speaker: s3_announcement_src
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    # Incoming-message detection (tap to silence, Do not disturb, volume).
    on_announcement:
      - script.execute: intercom_announce_start
    on_idle:
      - script.execute: intercom_announce_end
    on_play:
      - script.execute: intercom_announce_end

# ── Push-to-talk hooks (packages/intercom.yaml) ──────────────────────────────
# No Assist and no alarms: a tap only silences an incoming message.

script:
  - id: ptt_hook_talk_start
    then:
      - logger.log:
          format: "talk start"
          level: VERBOSE
  - id: ptt_hook_talk_end
    then:
      - logger.log:
          format: "talk end"
          level: VERBOSE
  - id: ptt_hook_tap
    then:
      - logger.log: "tap — no action on this device"
  - id: ptt_hook_dismiss
    then:
      - logger.log:
          format: "dismiss"
          level: VERBOSE
