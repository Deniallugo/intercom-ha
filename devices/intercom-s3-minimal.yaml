# Minimal boot test for the M5Stack VoiceS3R / EchoS3R.
# No audio, no I2C, no recorder/uploader. Just: boot → WiFi → API.
# If this works, we add components back one at a time in intercom-s3.yaml.

substitutions:
  name: esphome-web-0f4600
  friendly_name: Intercom S3

packages:
  secrets: !include secrets-s3.yaml
  base: !include ../packages/base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.1.0

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

# Try ESPHome's default UART pick first. If still no logs, change to USB_CDC
# or USB_SERIAL_JTAG and reflash.
logger:
  level: DEBUG
